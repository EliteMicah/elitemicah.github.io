<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DormDeal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      width: 80px;
      height: 80px;
      background: #027BFF;
      border-radius: 18px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }
    h1 { font-size: 1.6rem; font-weight: 700; color: #111827; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #4B5563; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: block;
      background: #027BFF;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn.secondary {
      background: #F3F4F6;
      color: #111827;
    }
    .android-section { display: none; }
    .android-section p {
      font-size: 0.9rem;
      color: #6B7280;
      margin-bottom: 14px;
    }
    .beta-form { display: flex; flex-direction: column; gap: 10px; }
    .beta-form input {
      border: 1px solid #D1D5DB;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      color: #111827;
    }
    .beta-form input:focus { border-color: #027BFF; }
    .beta-form input::placeholder { color: #9CA3AF; }
    .success-msg { display: none; color: #059669; font-size: 0.9rem; font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎓</div>
    <h1>DormDeal</h1>
    <p id="main-desc">Your school was just approved! Download the app to sign up and start buying and selling with your campus community.</p>

    <a href="https://apps.apple.com/us/app/dormdeal/id6751549548" class="btn" id="ios-btn" style="display:none">Download on the App Store</a>
    <a href="dormdeal://signUpScreen" class="btn secondary" id="open-btn" style="display:none">Open DormDeal</a>

    <div class="android-section" id="android-section">
      <p>Android is coming soon! Drop your email and we'll add you to our beta testers.</p>
      <form class="beta-form" id="beta-form" action="https://formspree.io/f/maqvgpgy" method="POST">
        <input type="hidden" name="type" value="Android Beta Request">
        <input type="email" name="email" placeholder="Your email" required>
        <button type="submit" class="btn" style="border:none;cursor:pointer;">Join Android Beta</button>
      </form>
      <p class="success-msg" id="success-msg">You're on the list! We'll reach out soon.</p>
    </div>
  </div>
  <script>
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua);
    const isAndroid = /Android/.test(ua);

    if (isIOS) {
      document.getElementById('ios-btn').style.display = 'block';
      document.getElementById('open-btn').style.display = 'block';
    } else if (isAndroid) {
      document.getElementById('main-desc').textContent = 'Your school was just approved! Android is coming soon — join the beta to be first in line.';
      document.getElementById('android-section').style.display = 'block';
    } else {
      document.getElementById('ios-btn').style.display = 'block';
      document.getElementById('android-section').style.display = 'block';
    }

    document.getElementById('beta-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { Accept: 'application/json' },
      });
      form.style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    });
  </script>
</body>
</html>
